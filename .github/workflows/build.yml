name: Inertia Cursor

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Test the motion model
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/InertiaCursor.exe dist/
          Copy-Item inertia-cursor.ini dist/
          Copy-Item README.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: InertiaCursor
          path: dist/
