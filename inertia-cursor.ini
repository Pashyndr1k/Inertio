; Inertia Cursor settings. Keep this file next to InertiaCursor.exe, then restart the app
; (tray icon > Quit, and run it again). Delete a line to go back to its default.
; Frequency, Damping, Drag and MaxAngle can also be picked from the tray menu, which saves
; them here for you.

[Motion]
; How quickly the arrow swings back to the classic pose, in swings per second.
Frequency=3.0
; Below 1 it overshoots a little before settling; 1 or more returns without overshoot.
Damping=0.32
; How far moving the mouse turns the arrow toward the motion.
Drag=520
; How much it swings when you start or stop moving.
Kick=140
; The furthest it can turn either way, in degrees.
MaxAngle=149

[Look]
; Arrow size, on top of the pointer size you chose in Windows settings.
Size=1.0
; Soft shadow under the arrow: 1 on, 0 off.
Shadow=1
